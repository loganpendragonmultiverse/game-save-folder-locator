[build-system]
requires = ["setuptools>=78", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "game-save-folder-locator"
version = "1.1.0"
description = "Search and validate a community-editable catalog of sourced game-save folder templates."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Logan Pendragon Multiverse" }]
dependencies = []

[project.optional-dependencies]
dev = ["build>=1.3,<2", "mypy>=1.15,<3", "pip-audit>=2.9,<3", "pytest>=8,<10", "pytest-cov>=6,<8", "ruff>=0.11,<1"]

[project.scripts]
save-folder-locator = "game_save_folder_locator.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
game_save_folder_locator = ["catalog.json"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.mypy]
python_version = "3.10"
strict = true

[tool.coverage.run]
omit = ["src/*/__main__.py"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=game_save_folder_locator --cov-branch --cov-report=term-missing --cov-fail-under=90"
